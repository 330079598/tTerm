name: Check

on:
  push:
    branches:
      - dev
      - main
    # None of the checks read Markdown or the screenshots, so a change
    # that touches only these has nothing to check.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: File size
        run: pnpm check:size

  rust-fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

  rust:
    # Clippy and the tests run on every platform the app ships for, since
    # much of the backend is behind cfg(target_os) and only builds there.
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libudev-dev patchelf openssh-server zsh fish

      # generate_context! needs frontendDist to exist; the checks do not
      # need the built frontend in it.
      - name: Create frontend dist placeholder
        shell: bash
        run: mkdir -p dist

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        working-directory: src-tauri
        run: cargo test

      # RSA host keys and key files depend on which russh features are on, so
      # they are checked against a real OpenSSH server, which only this
      # runner has.
      - name: Test RSA against a real sshd (Ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        working-directory: src-tauri
        run: >-
          cargo test --lib -- --ignored
          real_sshd_with_only_an_rsa_host_key
          real_sshd_accepts_an_rsa_key_file
          real_sshd_accepts_a_pem_rsa_key_file

      # Shell integration starts the user's bash, zsh or fish through
      # unix/start.sh, which only the real shells show working. The Ubuntu
      # runner has all three plus sshd, where the runner's login shell is bash.
      - name: Test shell integration with real shells (Ubuntu only)
        if: matrix.platform == 'ubuntu-24.04'
        working-directory: src-tauri
        run: cargo test --lib -- --ignored real_shell_integration

      # macOS's own bash takes a path of its own in unix/start.sh.
      - name: Test shell integration with real shells (macOS only)
        if: matrix.platform == 'macos-latest'
        working-directory: src-tauri
        run: >-
          cargo test --lib -- --ignored
          real_shell_integration_marks_commands_in_each_shell
          real_shell_integration_reports_the_directory_with_marks_off
