name: Sync Release Notes To Updater Manifest

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "Updater channel to sync"
        required: true
        default: "stable"
        type: choice
        options:
          - stable
          - beta-dev
      tag:
        description: "GitHub release tag, for example v1.2.3 or v1.2.3-beta.1"
        required: true
        type: string
  release:
    types:
      - edited

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    concurrency:
      group: github-pages-updater-manifest
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v4

      - name: Resolve sync target
        id: target
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_CHANNEL: ${{ inputs.channel }}
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_PRERELEASE: ${{ github.event.release.prerelease }}
        shell: bash
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            CHANNEL="$INPUT_CHANNEL"
            TAG="$INPUT_TAG"
            MANUAL="true"
          else
            TAG="$RELEASE_TAG"
            MANUAL="false"
            if [ "$RELEASE_PRERELEASE" = "true" ]; then
              CHANNEL="beta-dev"
            else
              CHANNEL="stable"
            fi
          fi

          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "manual=${MANUAL}" >> "$GITHUB_OUTPUT"
          echo "Resolved ${TAG} to ${CHANNEL}."

      - name: Checkout GitHub Pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          REMOTE="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git clone --branch github-pages --depth 1 "$REMOTE" pages

      - name: Sync release notes into updater manifests
        id: sync_notes
        env:
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STRICT_VERSION_MATCH: ${{ steps.target.outputs.manual }}
        shell: bash
        run: |
          MANIFESTS=("pages/update/${{ steps.target.outputs.channel }}/latest.json")
          if [ "${{ steps.target.outputs.channel }}" = "beta-dev" ]; then
            MANIFESTS+=("pages/beta-dev/latest.json")
          fi
          node .github/scripts/sync-updater-manifest-notes.mjs "${MANIFESTS[@]}"

      - name: Commit updated manifests
        if: steps.sync_notes.outputs.changed == 'true'
        env:
          CHANNEL: ${{ steps.target.outputs.channel }}
          RELEASE_TAG: ${{ steps.target.outputs.tag }}
        shell: bash
        run: |
          cd pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add "update/${CHANNEL}/latest.json"
          if [ "$CHANNEL" = "beta-dev" ]; then git add "beta-dev/latest.json"; fi

          git commit -m "Sync ${CHANNEL} release notes for ${RELEASE_TAG}"
          git push origin github-pages
