<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>tTerm</title>
    <link rel="stylesheet" href="/src/components/Crab/crab.css" />
    <style>
      /* Splash screen styles - loaded immediately */
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        /* Last theme background (injected by the backend), default theme until
           there is one; preloadTheme then applies the full theme */
        background-color: var(--boot-bg, hsl(220 13% 12%));
      }

      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.3s ease-out;
      }

      #splash-screen::before {
        content: "";
        position: absolute;
        inset: 0;
        /* Semi-transparent overlay for depth */
        background: rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(32px);
        -webkit-backdrop-filter: blur(32px);
      }

      #splash-screen.hidden {
        opacity: 0;
        pointer-events: none;
      }

      .splash-content {
        position: relative;
        z-index: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .splash-crab {
        width: 120px;
        height: 88px;
        margin-bottom: 32px;
      }

      .splash-progress {
        position: relative;
        width: 192px;
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 9999px;
        overflow: hidden;
      }

      .splash-progress-bar {
        height: 100%;
        background: linear-gradient(90deg, #3b82f6, rgba(59, 130, 246, 0.8), #3b82f6);
        border-radius: 9999px;
        animation: progress 1.5s ease-in-out infinite;
      }

      .splash-text {
        margin-top: 16px;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.7);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }

      @keyframes progress {
        0% {
          width: 0%;
          margin-left: 0%;
        }
        50% {
          width: 50%;
          margin-left: 25%;
        }
        100% {
          width: 0%;
          margin-left: 100%;
        }
      }
    </style>
  </head>

  <body>
    <!-- Splash screen - shown immediately -->
    <div id="splash-screen" data-tauri-drag-region>
      <div class="splash-content">
        <!-- The crab pinches while the app loads. These are the layers the Crab
             component (src/components/Crab) builds, written out since React
             is not running yet. -->
        <span class="crab splash-crab" data-motion="pinch" data-size="full" aria-hidden="true">
          <span class="crab-figure">
            <span class="crab-side">
              <span class="crab-claw">
                <img src="/src/assets/crab/arm.svg" alt="" />
                <img class="crab-jaw-outer" src="/src/assets/crab/jaw-outer.svg" alt="" />
                <img class="crab-jaw-inner" src="/src/assets/crab/jaw-inner.svg" alt="" />
              </span>
            </span>
            <span class="crab-side" data-mirrored>
              <span class="crab-claw">
                <img src="/src/assets/crab/arm.svg" alt="" />
                <img class="crab-jaw-outer" src="/src/assets/crab/jaw-outer.svg" alt="" />
                <img class="crab-jaw-inner" src="/src/assets/crab/jaw-inner.svg" alt="" />
              </span>
            </span>
            <img src="/src/assets/crab/body.svg" alt="" />
            <img class="crab-eyes" src="/src/assets/crab/eyes.svg" alt="" />
          </span>
        </span>
        <div class="splash-progress">
          <div class="splash-progress-bar"></div>
        </div>
        <p class="splash-text">Loading tTerm...</p>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
