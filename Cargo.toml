# The workspace lives at the repository root so the Tauri app and the crates
# the GPUI version is built from share one target directory, one lockfile and
# one set of lints. `src-tauri/` stays a member until the GPUI version ships.
[workspace]
members = ["src-tauri", "crates/*"]
# A virtual workspace would default to resolver 1, which resolves the Tauri
# package's dependencies differently from when it built on its own. Resolver 3
# is resolver 2 plus MSRV-aware version selection, so a later `cargo update`
# cannot pull in a crate that needs a newer compiler than rust-toolchain.toml
# pins. On 1.99.1 it resolves the same 1125 packages as resolver 2 (P0-06).
resolver = "3"

# The two dependencies of the GPUI version, pinned here so every crate takes
# them from one place. Both come from crates.io only: no git source, no fork
# and no personal branch may appear here (decision 007). `gpui-kit` carries the
# matching `gpui-pre` 0.3.11 snapshot of Zed, so GPUI and its platform layer are
# used through its re-exports instead of as separate dependencies.
[workspace.dependencies]
gpui-kit = "=0.9.0"
alacritty_terminal = "=0.26.0"

[workspace.lints.clippy]
# Threshold in clippy.toml. Older functions over it carry an `expect` that
# fails once they are split, so the marker cannot outlive the debt.
too_many_lines = "warn"

# Dev-build settings for dependencies only; tTerm itself keeps the default
# profile (full debuginfo, no optimization), so the debugger still sees locals
# and types in our own code.
# - Line tables only: per-crate .pdb files on MSVC are what balloons
#   target/deps to tens of GB, and backtraces through dependencies still show
#   file names and line numbers.
# - opt-level 2: unoptimized argon2, ring, aes-gcm and russh make unlocking and
#   connecting painfully slow in dev builds. Dependencies rarely rebuild, so
#   this only costs time on a full build.
# - GPUI is covered by the same setting. Lowering it for the GPUI crates would
#   cut the first build of a GPUI binary from 135s to 48s on an M4. P0-06 kept
#   it because unoptimized text shaping and animation are expected to make the
#   dev build sluggish; nobody has measured that yet, so P0-08 checks it once a
#   real window opens. Incremental builds take 0.5s either way.
[profile.dev.package."*"]
debug = "line-tables-only"
opt-level = 2

# To step into one dependency with its locals, give just that crate full
# debuginfo instead of dropping the section above:
# [profile.dev.package.russh]
# debug = 2
# opt-level = 0
