[package]
name = "tterm-platform"
version = "0.1.0"
edition = "2024"
description = "Native platform capabilities behind traits the interface can inject"
license = "MIT"
publish = false

[lints]
workspace = true

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs"] }
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
# Touch ID / login password prompts (see ssh/secret_store/os_verifier.rs).
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSEnumerator", "NSString", "NSBundle", "NSDate", "NSDictionary", "NSFileManager", "NSGeometry", "NSObject", "NSOperation", "NSProcessInfo", "NSURL", "NSValue"] }
# System notifications whose clicks lead back to their tab (see notification/macos.rs).
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger"] }
block2 = "0.6"
# Dragging remote files onto Finder as file promises (see drag_out/macos.rs),
# and the Open With applications with their icons (see sftp/internal/api/external/apps.rs).
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "objc2-uniform-type-identifiers", "NSBitmapImageRep", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSEvent", "NSFilePromiseProvider", "NSGraphics", "NSGraphicsContext", "NSImage", "NSImageRep", "NSPasteboard", "NSResponder", "NSView", "NSWindow", "NSWorkspace"] }
objc2-uniform-type-identifiers = { version = "0.3", default-features = false, features = ["std", "UTType"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_Foundation", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_WinRT", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Security", "Security_Credentials_UI", "UI_Notifications", "Data_Xml_Dom", "Foundation"] }
windows-future = "0.3"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
zbus = "5"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
