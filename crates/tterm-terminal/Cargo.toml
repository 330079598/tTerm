[package]
name = "tterm-terminal"
version = "0.1.0"
edition = "2024"
description = "Terminal model shared by the clients, free of any UI framework"
license = "MIT"
publish = false

[lints]
workspace = true

[dependencies]
# The only external source of terminal state: parsing, the grid, scrollback,
# selection and search all come from the official crate pinned in P0-06. No
# patch, no fork and no git source may replace it (decision 007).
alacritty_terminal.workspace = true
regress = { version = "=0.12.0", features = ["utf16"] }
# The default hint pattern is Alacritty's URL regex. The lock file already
# carries regex 1.13.1 through src-tauri, so this adds no new package and no
# new version; P0-28's report records it as a new direct dependency.
regex = "1"
