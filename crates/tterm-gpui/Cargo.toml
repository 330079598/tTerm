[package]
name = "tterm-gpui"
version = "0.1.0"
edition = "2024"
description = "The GPUI client of tTerm, which starts as the P0-08 minimal program"
license = "MIT"
publish = false

[lints]
workspace = true

[dependencies]
# The pinned facade; GPUI and its platform layer come through its re-exports.
# Do not add a version here and do not select the `gpui-fast` feature: the
# workspace pins the source and decision 007 keeps the official GPUI only.
gpui-kit.workspace = true

[dev-dependencies]
# Headless windows and UI queries for the sample test; see src/app/tests.rs.
# `profiler` enables GPUI's frame timings for the P0-10 drawing benchmark.
gpui-kit = { workspace = true, features = ["test-support", "profiler"] }
# The P0-28 glyph grid and the P0-10 terminal examples paint through the view
# crate.
tterm-terminal-view = { path = "../tterm-terminal-view" }
tterm-terminal = { path = "../tterm-terminal" }
# The real-PTY demo and the benchmark. Both are already in Cargo.lock through
# the Tauri application, so no new package or version is introduced.
portable-pty = "0.9"
async-channel = "2"
