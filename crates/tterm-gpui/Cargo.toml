[package]
name = "tterm-gpui"
version = "0.1.0"
edition = "2024"
description = "The GPUI client of tTerm; for now the P0-14 local PTY prototype"
license = "MIT"
publish = false

[features]
# The automation endpoint is intentionally opt-in. Its source is also gated
# by `debug_assertions`, so a release build cannot contain the endpoint.
automation = ["gpui-kit/test-support", "dep:image"]

[lints]
workspace = true

[dependencies]
# The pinned facade; GPUI and its platform layer come through its re-exports.
# Do not add a version here and do not select the `gpui-fast` feature: the
# workspace pins the source and decision 007 keeps the official GPUI only.
gpui-kit.workspace = true
tterm-terminal-view = { path = "../tterm-terminal-view" }
tterm-terminal = { path = "../tterm-terminal" }
# The prototype's PTY and its wake channel. Both were already in Cargo.lock
# through the Tauri application, so no new package or version is introduced.
# P1-12 replaces the direct portable-pty use with AppServices.
portable-pty = "0.9"
async-channel = "2"
image = { version = "=0.25.10", default-features = false, features = ["png"], optional = true }

[dev-dependencies]
# `test-support` gives the terminal_view example `Window::render_to_image` for
# its screenshot; `profiler` enables GPUI's frame timings for the P0-10
# drawing benchmark.
gpui-kit = { workspace = true, features = ["test-support", "profiler"] }

[target.'cfg(windows)'.dependencies]
# Loads the bundled conpty.dll by full path; the version is the one pins.md
# fixes for tTerm and gpui-pre.
windows = { version = "0.62.2", features = ["Win32_System_LibraryLoader", "Win32_Security_Cryptography"] }
