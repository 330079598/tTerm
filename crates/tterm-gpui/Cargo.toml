[package]
name = "tterm-gpui"
version = "0.1.0"
edition = "2024"
description = "The GPUI client of tTerm; currently a runtime prototype"
license = "MIT"
publish = false

[[example]]
name = "p0_19_drag_out"
path = "examples/p0_19_drag_out/main.rs"
test = true

[[example]]
name = "p0_20_remote_editor"
path = "examples/p0_20_remote_editor/main.rs"
# Keep the probe's regression tests in the required workspace test run.
test = true

[[example]]
name = "settings_capture"
path = "examples/settings_capture.rs"
# The headless Metal/WGPU capture needs the automation feature's test support.
required-features = ["automation"]

[[example]]
name = "theme_library_capture"
path = "examples/theme_library_capture.rs"
# The headless Metal/WGPU gallery capture needs the automation feature's test support.
required-features = ["automation"]
test = false

[[example]]
name = "search_capture"
path = "examples/search_capture.rs"
# The headless Metal/WGPU capture needs the automation feature's test support.
required-features = ["automation"]

[[example]]
name = "first_screen_capture"
path = "examples/first_screen_capture/main.rs"
# The native-window capture drives the debug automation endpoint.
required-features = ["automation"]
test = false

[[example]]
name = "seed_ssh_check"
path = "examples/seed_ssh_check.rs"
# The example writes a disposable debug instance; it is not a test target.
test = false

[[example]]
name = "ssh_tui_field"
path = "examples/ssh_tui_field.rs"
# The field entry only exists in debug builds with the gated automation module.
required-features = ["automation"]
test = false

[features]
# The automation endpoint is intentionally opt-in. Its source is also gated
# by `debug_assertions`, so a release build cannot contain the endpoint.
automation = ["gpui-kit/test-support", "dep:image"]

[lints]
workspace = true

[dependencies]
# The pinned facade; GPUI and its platform layer come through its re-exports.
# Do not add a version here and do not select the `gpui-fast` feature: the
# workspace pins the source and decision 007 keeps the official GPUI only.
gpui-kit.workspace = true
tterm-core = { path = "../tterm-core" }
tterm-platform = { path = "../tterm-platform" }
tterm-ui = { path = "../tterm-ui" }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "=0.40.2", features = ["bundled"] }
zeroize = "=1.9.0"
tterm-terminal-view = { path = "../tterm-terminal-view" }
tterm-terminal = { path = "../tterm-terminal" }
tokio = { version = "=1.53.1", features = ["rt-multi-thread", "sync"] }
image = { version = "=0.25.10", default-features = false, features = ["png"], optional = true }

[dev-dependencies]
rand = "=0.10.3"
russh = { version = "=0.63.3", default-features = false, features = ["ring", "rsa"] }
# The opt-in tunnel screenshot test crops its rendered viewport to the fixed
# 800x600 page before saving the PNG.
image = { version = "=0.25.10", default-features = false, features = ["png"] }
# `test-support` gives the terminal_view example `Window::render_to_image` for
# its screenshot; `profiler` enables GPUI's frame timings for the P0-10
# drawing benchmark.
gpui-kit = { workspace = true, features = ["test-support", "profiler"] }
# In-memory database fixtures for the window-state tests.
tterm-core = { path = "../tterm-core", features = ["test-support"] }

[target.'cfg(unix)'.dev-dependencies]
portable-pty = "=0.9.0"

[target.'cfg(windows)'.dependencies]
# Loads the bundled conpty.dll by full path; the version is the one pins.md
# fixes for tTerm and gpui-pre.
windows = { version = "=0.62.2", features = ["Win32_System_LibraryLoader", "Win32_Security_Cryptography", "Win32_System_Com", "Win32_System_Ole", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }
