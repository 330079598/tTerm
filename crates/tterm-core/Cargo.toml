[package]
name = "tterm-core"
version = "0.1.0"
edition = "2024"
description = "Domain services shared by the Tauri and the GPUI client"
license = "MIT"
publish = false

[lints]
workspace = true

[features]
test-support = []

[dependencies]
dirs = "=7.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gethostname = "=1.1.0"
tterm-platform = { path = "../tterm-platform" }
tokio = { version = "1", features = ["fs"] }
uuid = { version = "1", features = ["v4"] }
