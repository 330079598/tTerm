[package]
name = "tTerm"
version = "0.4.1"
description = "A SSH APP"
authors = ["stone"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "t_term_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [ "devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
tauri-plugin-os = "2.3.2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2.3.2"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "net"] }
russh = { version = "0.63", default-features = false, features = ["ring"] }
russh-sftp = "3"
# Both are already linked through russh and rustls; named here because RSA key
# files are signed with ring instead of the `rsa` crate (see ssh/rsa_signer.rs).
ring = "0.17"
num-bigint = "0.5"
async-trait = "0.1"
aes-gcm = "0.11"
argon2 = "0.6"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crc32fast = "1"
flate2 = "1"
sha2 = "0.11"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
quick-xml = "0.42"
percent-encoding = "2"
rand = "0.10"
vte = "0.15"
zeroize = "1"
# `v1` (default) picks Keychain / Credential Manager / Secret Service per platform.
keyring = "4"
sys-locale = "0.3"
ttf-parser = "0.25"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-frame = "1.1.6"
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_Foundation", "Win32_System_DataExchange", "Win32_UI_Shell", "Win32_System_WinRT", "Security_Credentials_UI"] }
# Names the async result type of Windows Hello prompts (see ssh/secret_store/os_verifier.rs).
windows-future = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-frame = "1.1.6"
security-framework = "3"
objc2 = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }
