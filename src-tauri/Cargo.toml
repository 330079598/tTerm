[package]
name = "tTerm"
version = "0.5.4"
description = "A SSH APP"
authors = ["stone"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "t_term_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "devtools", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }
rusqlite = { version = "0.40", features = ["bundled"] }
tauri-plugin-os = "2.3.2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2.3.2"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "net"] }
russh = { version = "0.63", default-features = false, features = ["ring"] }
russh-sftp = "3"
# Both are already linked through russh and rustls; named here because RSA key
# files are signed with ring instead of the `rsa` crate (see ssh/rsa_signer.rs).
ring = "0.17"
num-bigint = "0.5"
async-trait = "0.1"
aes-gcm = "0.11"
argon2 = "0.6"
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crc32fast = "1"
flate2 = "1"
sha2 = "0.11"
zip = { version = "8", default-features = false, features = ["deflate-flate2-zlib-rs"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
quick-xml = "0.42"
percent-encoding = "2"
rand = "0.10"
vte = "0.15"
unicode-width = "0.2"
encoding_rs = "0.8"
zeroize = "1"
# `v1` (default) picks Keychain / Credential Manager / Secret Service per platform.
keyring = "4"
sys-locale = "0.3"
ttf-parser = "0.25"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-frame = "1.1.6"
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_WinRT", "Win32_System_Console", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Security", "Security_Credentials_UI", "UI_Notifications", "Data_Xml_Dom", "Foundation"] }
# Names the WebView2 controller types for the IME focus repair (see ime_focus.rs).
# Must be the version tauri/wry use; upgrade together.
webview2-com = "0.39"
# Names the async result type of Windows Hello prompts (see ssh/secret_store/os_verifier.rs).
# Must be the version `windows` itself uses (0.62 -> 0.3); upgrade the two together.
windows-future = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-frame = "1.1.6"
security-framework = "3"
objc2 = "0.6"
# Touch ID / login password prompts (see ssh/secret_store/os_verifier.rs).
objc2-local-authentication = { version = "0.3", default-features = false, features = ["std", "block2", "LAContext", "LAError"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSString", "NSBundle", "NSDictionary", "NSObject"] }
# System notifications whose clicks lead back to their tab (see notification/macos.rs).
objc2-user-notifications = { version = "0.3", default-features = false, features = ["std", "bitflags", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationSound", "UNNotificationTrigger"] }
block2 = "0.6"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

# Dev-build settings for dependencies only; tTerm itself keeps the default
# profile (full debuginfo, no optimization), so the debugger still sees locals
# and types in our own code.
# - Line tables only: per-crate .pdb files on MSVC are what balloons
#   target/deps to tens of GB, and backtraces through dependencies still show
#   file names and line numbers.
# - opt-level 2: unoptimized argon2, ring, aes-gcm and russh make unlocking and
#   connecting painfully slow in dev builds. Dependencies rarely rebuild, so
#   this only costs time on a full build.
[profile.dev.package."*"]
debug = "line-tables-only"
opt-level = 2

# To step into one dependency with its locals, give just that crate full
# debuginfo instead of dropping the section above:
# [profile.dev.package.russh]
# debug = 2
# opt-level = 0
