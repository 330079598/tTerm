[package]
name = "tTerm"
version = "0.8.1"
description = "A SSH APP"
authors = ["stone"]
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "t_term_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tterm-platform = { path = "../crates/tterm-platform" }
tterm-core = { path = "../crates/tterm-core" }
tauri = { version = "2", features = ["macos-private-api", "devtools", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-os = "2.3.2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2.3.2"
portable-pty = "0.9"
uuid = { version = "1", features = ["v4"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "net", "process"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Used by the session-sink throughput benchmark only.
sha2 = "0.11"
zeroize = "1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "windows")'.dependencies]
tauri-plugin-frame = "1.1.6"
windows = { version = "0.62", features = ["Win32_Graphics_Gdi", "Win32_Foundation", "Win32_System_Com", "Win32_System_DataExchange", "Win32_System_LibraryLoader", "Win32_System_Ole", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_WinRT", "Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_Storage_FileSystem", "Win32_Security", "Security_Credentials_UI", "UI_Notifications", "Data_Xml_Dom", "Foundation"] }
# Names the WebView2 controller types for the IME focus repair (see ime_focus.rs).
# Must be the version tauri/wry use; upgrade together.
webview2-com = "0.39"

[target.'cfg(target_os = "macos")'.dependencies]
tauri-plugin-frame = "1.1.6"
objc2 = "0.6"

[dev-dependencies]
tterm-core = { path = "../crates/tterm-core", features = ["test-support"] }
tauri = { version = "2", features = ["test"] }
tokio = { version = "1", features = ["test-util"] }
